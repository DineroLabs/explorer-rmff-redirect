<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dinero Explorer has moved</title>
  <link rel="canonical" href="https://explorer.dcash.live/">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://explorer.dcash.live/">
  <script>
    (function () {
      var base = 'https://explorer.dcash.live/';
      var target = base;
      if (window.location.hash) {
        target = base + window.location.search + window.location.hash;
      } else if (window.location.pathname !== '/') {
        target = base + '#' + window.location.pathname + window.location.search;
      } else if (window.location.search) {
        target = base + window.location.search;
      }
      window.location.replace(target);
    }());
  </script>
  <style>
    :root { color-scheme: light dark; }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
           font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    main { text-align:center; padding:2rem; max-width:34rem; }
    h1 { font-size:1.25rem; font-weight:600; margin:0 0 .5rem; }
    p { margin:.25rem 0; opacity:.75; }
    a { color:#1f6feb; }
  </style>
</head>
<body>
  <main>
    <h1>The Dinero explorer has moved</h1>
    <p>Redirecting to <a href="https://explorer.dcash.live/">explorer.dcash.live</a>&hellip;</p>
    <p>If you are not redirected, follow the link above.</p>
  </main>
</body>
</html>
